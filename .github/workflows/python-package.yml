---
name: Python package

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry poetry-plugin-export

      - name: Install project dependencies
        run: |
          poetry export -f requirements.txt --with dev --output requirements.txt
          pip install -r requirements.txt

      - name: Lint with pylint
        run: |
          pylint .

      - name: Lint with mypy
        run: |
          mypy .

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Check formatting with ruff
        run: |
          ruff format --check .

  test_deploy:
    runs-on: ubuntu-latest
    name: Publish on Test PyPi
    if: github.event_name == 'push'
    needs:
      - build

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Build Python package
        run: |
          # PyPi does not allow local version (v1.0+xxx), so only count commits since latest tag
          poetry version $(git describe --tags --always | sed 's/-\([0-9]\+\).*/.dev\1/')
          poetry build

      - name: Publish package to Test PyPi
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/
